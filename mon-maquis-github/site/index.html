function rnd(){var a=new Uint8Array(16);try{crypto.getRandomValues(a)}catch(e){for(var i=0;i<16;i++)a[i]=Math.random()*256}return Array.prototype.map.call(a,function(x){return("0"+x.toString(16)).slice(-2)}).join("")}
function vib(){if(D.vib!==0)try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}
function SNAP(){var o=JSON.parse(JSON.stringify(D));delete o.dev;delete o.lic;return JSON.stringify(o)}
function obEmpty(){D.setup=true;tab=5;save();draw()}
function stage(){if(!D.nom)return"nom";if(!licOK())return"code";if(!D.setup)return"ob";return"app"}
function licOK(){if(!LIC_URL)return true;var L=D.lic;if(!L||!L.ok)return false;var a=Date.now()-L.last;return a<GRACE&&a>-864e5}
function post(path,body){var c=new AbortController(),t=setTimeout(function(){c.abort()},12000);
 return fetch(LIC_URL.replace(/\/+$/,"")+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:c.signal}).then(function(r){clearTimeout(t);return r.json()},function(e){clearTimeout(t);throw e})}
function lmsg(t){var e=document.getElementById("lmsg");if(e)e.textContent=t}
function normCode(s){return String(s).toUpperCase().replace(/[^0-9A-Z]/g,"").replace(/O/g,"0").replace(/[IL]/g,"1")}
function fmtCode(el){el.value=normCode(el.value).slice(0,16).replace(/(.{4})(?=.)/g,"$1-")}
function lic(){var c=normCode(document.getElementById("lc").value);if(c.length!=16){lmsg("Le code a 16 caractères. Vérifie-le.");return}
 var b=document.getElementById("lgo");b.disabled=true;b.textContent="Vérification…";
 post("/activer",{code:c,device:D.dev}).then(function(r){
  if(r.ok){D.lic={code:c,ok:true,last:Date.now()};save();draw();toast("✅ Application activée")}
  else{b.disabled=false;b.textContent="Activer";lmsg(ERR[r.err]||"Code refusé.")}
 }).catch(function(){b.disabled=false;b.textContent="Activer";lmsg("Pas de connexion. Connecte-toi à internet et réessaie.")})}
function reverify(){var L=D.lic;post("/verifier",{code:L.code,device:D.dev}).then(function(r){
  if(r.ok){L.last=Date.now();save();draw()}else{L.ok=false;L.err=r.err;save();draw()}
 }).catch(function(){lmsg("Toujours pas de connexion.")})}
function recheck(){if(!LIC_URL||!D.lic||!D.lic.ok||Date.now()-D.lic.last<REVERIF)return;
 post("/verifier",{code:D.lic.code,device:D.dev}).then(function(r){
  if(r.ok){D.lic.last=Date.now();save()}
  else if(r.err=="invalide"||r.err=="revoque"||r.err=="utilise"){D.lic.ok=false;D.lic.err=r.err;save();draw()}
 }).catch(function(){})}
function nmGo(){var v=document.getElementById("mn").value.trim().replace(/\s+/g," ");if(v.length<2){toast("Écris le nom de ton maquis.");return}D.nom=v.slice(0,30);save();draw()}
function vNom(){return '<div class="k" style="text-align:center;margin-top:24px"><div style="font-size:56px">🍺</div><h2 style="margin:6px 0">Bienvenue !</h2><p class="hint">Comment s’appelle ton maquis ?</p><input id="mn" maxlength="30" placeholder="Ex : O&#39;Show" onkeydown="if(event.key==\'Enter\')nmGo()"><button class="big" style="background:var(--pri);margin-top:12px" onclick="nmGo()">Continuer ›</button><p class="hint">Tu as déjà une sauvegarde ?</p><button class="sm" onclick="rsShow()">♻️ Restaurer</button><div id="bk"></div></div>'}
function vCode(){var L=D.lic,lock=L&&!licOK(),sub,form;
 if(lock&&L.ok){sub="Connecte-toi à internet pour vérifier ta licence, puis touche Réessayer.";form='<button class="big" style="background:var(--pri)" onclick="reverify()">Réessayer</button>'}
 else{sub=lock?(ERR[L.err]||"Ta licence n’est plus valide.")+" Tu peux entrer un autre code.":"Entre le code d’activation reçu après ton achat.";
  form='<input id="lc" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX" style="text-align:center;font-size:20px" oninput="fmtCode(this)" onkeydown="if(event.key==\'Enter\')lic()"><button id="lgo" class="big" style="background:var(--pri);margin-top:12px" onclick="lic()">Activer</button>'}
 return '<div class="k" style="text-align:center;margin-top:24px"><div style="font-size:56px">🔑</div><h2 style="margin:6px 0">'+E(D.nom)+'</h2><p class="hint">'+E(sub)+'</p>'+form+'<div id="lmsg" role="alert" style="color:var(--ko);font-weight:700;min-height:22px;margin-top:8px"></div><p class="hint">Internet est nécessaire pour activer. Le code est personnel : il marche sur un nombre limité de téléphones.</p>'+
 (BUY_URL?'<a class="sm" style="display:inline-block;text-decoration:none;margin:4px" href="'+E(BUY_URL)+'" target="_blank" rel="noopener">🛒 Je n’ai pas de code</a>':"")+(SUPPORT_WA?'<a class="sm" style="display:inline-block;text-decoration:none;margin:4px" href="https://wa.me/'+E(SUPPORT_WA)+'?text='+encodeURIComponent("Bonjour, j’ai besoin d’aide pour activer Mon Maquis ("+D.nom+").")+'" target="_blank" rel="noopener">💬 Besoin d’aide ?</a>':"")+'</div>'}
function LICC(){var L=D.lic;return LIC_URL&&L&&L.ok?'<div class="k"><h3>🔑 Licence</h3><b style="color:var(--ok)">✅ Activée</b> <small>Code se terminant par '+E(L.code.slice(-4))+'</small></div>':""}
function MIG(){if((D.cv||0)>=2)return;
 var O={castel:[600,800],coca:[200,300],bock:[550,800],guinness:[700,1000],beaufort:[600,800],heineken:[700,1000],desperados:[800,1200],rhino:[600,800],"cody-beer":[600,1000],"cody-energy":[400,700],"vody-energy":[500,800],velpierre:[1500,2500],velpierre2:[1500,2500],orangina:[250,400]};
 D.p.forEach(function(p){var k=p.k||((CAT.filter(function(c){return c.n==p.n})[0]||{}).k);
  if(!k&&/^Velpierre/i.test(p.n))k=/\(2\)/.test(p.n)?"velpierre2":"velpierre";
  var c=CAT.filter(function(x){return x.k==k})[0];if(!c)return;
  if(k=="velpierre"||k=="velpierre2"){p.n=c.n;p.k=k}
  var o=O[k];if(o&&p.a==o[0]&&p.v==o[1]){p.a=c.a;p.v=c.v}});
 D.p=D.p.filter(function(p){return !(p.k=="flag"&&!D.log.some(function(e){return e.pid==p.id}))});
 if(D.setup&&!D.p.some(function(p){return p.k=="velpierre"})){var c=CAT.filter(function(x){return x.k=="velpierre"})[0];D.p.push({id:Date.now(),k:c.k,n:c.n,i:c.i,a:c.a,v:c.v,c:c.c,s:0})}
 D.cv=2;save()}
function AC(p){return p.ac||Math.round(p.a*p.c)}
function NV(){return D.p.filter(function(p){return !p.ok}).length}
function okA(id){P(id).ok=1;save();draw()}
function NVW(){var l=D.p.filter(function(p){return !p.ok});if(!l.length)return"";return '<div class="k" style="border-color:var(--ko)"><b>⚠️ Prix d’achat à vérifier pour '+l.length+' boisson'+(l.length>1?"s":"")+'</b><small style="margin:4px 0 8px">'+l.slice(0,5).map(function(p){return E(p.n)}).join(", ")+(l.length>5?"…":"")+' — la marge affichée est une estimation.</small><button class="sm" onclick="go(5)">Vérifier maintenant</button></div>'}
function NVB(){var n=NV();return n?'<div class="k" style="border-color:var(--ko)"><b>⚠️ '+n+' prix d’achat à confirmer</b><small>Entre le prix du casier (facture du dépôt), ou touche « C’est bon » si le prix affiché est juste.</small></div>':""}
var TB=[["🛒","Vendre",vVendre,1],["📦","Arrivage",vArrivage,0],["⚠️","Pertes",vPertes,1],["📒","Crédits",vCredits,1],["📊","Bilan",vBilan,0],["⚙️","Boissons",vBoissons,0]];
function go(i){if(i==5&&D.pin&&!UN){dlg("Code patron (4 chiffres) :",function(v){if(v==D.pin){UN=true;go(5)}else toast("Code incorrect.")},1);return}tab=i;draw();document.getElementById("m").scrollTop=0}
function scr(h){document.getElementById("nav").innerHTML="";document.getElementById("m").innerHTML=h}
function draw(){var st=stage();document.getElementById("rl").style.display=st=="app"?"":"none";if(st=="nom"){scr(vNom());return}if(st=="code"){scr(vCode());return}if(st=="ob"){drawOb();return}var m=document.getElementById("m"),y=m.scrollTop,sv=D.role=="gerant";
 if(sv&&!TB[tab][3])tab=0;
 m.innerHTML=(!D.p.length&&tab<4)?'<p class="hint">Aucune boisson. Ajoute-en dans l’onglet Boissons.</p>':TB[tab][2]();
 m.scrollTop=y;
 document.getElementById("nav").innerHTML=TB.map(function(x,i){return sv&&!x[3]?"":`<button class="${i==tab?"on":""}" onclick="go(${i})"><span>${x[0]}</span>${x[1]}</button>`}).join("");
 document.getElementById("br").textContent="🍺 "+(D.nom||"Mon Maquis");
 document.getElementById("rl").textContent=sv?"🔓 Patron":"👤 Gérant(e)";
 document.getElementById("dt").textContent=new Date(Date.now()-216e5).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"})}
draw();recheck();document.addEventListener("visibilitychange",function(){if(!document.hidden)recheck()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker"in navigator&&location.protocol.indexOf("http")==0)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
